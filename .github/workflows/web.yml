# Website: testen, Docker-image bouwen en op de VPS zetten.
# - Pull request naar main: testen + image bouwen (niet pushen).
# - Merge naar main: hetzelfde, image naar GHCR, deploy naar de VPS, smoke test.
# - Handmatig (Run workflow): opnieuw deployen, of met image_tag terugrollen naar een oudere commit.
# Unity-wijzigingen starten deze pipeline niet (behalve de netwerkscripts die de tests mee testen).
name: web

on:
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - "deploy/**"
      - ".github/workflows/web.yml"
      - "CN_VR/Assets/ApplicationConnection/Scripts/Net/**"
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "deploy/**"
      - ".github/workflows/web.yml"
      - "CN_VR/Assets/ApplicationConnection/Scripts/Net/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Terugrollen: commit-sha van een image dat al in GHCR staat. Leeg = deze commit bouwen en deployen."
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE: ghcr.io/renzoraes2006/collectivenarratives-web

jobs:
  test:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # geen LFS-quotum verbruiken, de website heeft de Unity-assets niet nodig
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tests
        run: dotnet test webapp/CollectiveNarratives.slnx

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: docker/setup-buildx-action@v3
      - name: Inloggen op GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bouwen${{ github.event_name != 'pull_request' && ' en pushen' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: webapp
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Ook als test/build zijn overgeslagen omdat we terugrollen naar een bestaande image_tag.
    if: ${{ always() && github.event_name != 'pull_request' && (needs.build.result == 'success' || inputs.image_tag) }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://collective-narratives.app
    concurrency: production
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.image_tag || github.sha }}
      DIR: /opt/collective-narratives
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: deploy

      - name: SSH klaarzetten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          EOF

      - name: Compose-bestand kopiëren
        run: scp deploy/docker-compose.yml "vps:$DIR/"

      - name: Nieuwe versie starten
        run: |
          # Tijdelijk inloggen op GHCR met het token van deze run (verloopt na de run, geen PAT nodig op de VPS).
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh vps "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          # $DIR en $TAG worden hier (op de runner) ingevuld, dat is de bedoeling.
          # shellcheck disable=SC2029
          ssh vps "set -e
            cd $DIR
            sed -i '/^IMAGE_TAG=/d' .env
            echo 'IMAGE_TAG=$TAG' >> .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io"

      - name: Smoke test
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS https://collective-narratives.app/healthz; then echo; echo "Live: $TAG"; exit 0; fi
            sleep 3
          done
          echo "healthz antwoordt niet"; exit 1
